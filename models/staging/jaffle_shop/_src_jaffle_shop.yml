sources:
  - name: jaffle_shop
    database: raw  
    schema: jaffle_shop  
    description: A clone of a postgres appication database
    config: 
      freshness:
        warn_after:
          count: 6
          period: hour
        error_after:
          count: 12
          period: hour
      loaded_at_field: _etl_loaded_at

    tables:
      - name: customers
        description: raw customer data.
        columns:
          - name: customer_id
            description: primary key for the customer data.
            data_tests:
              - unique
              - not_null
              
            
        config:
          freshness: null
      - name: orders
        description: raw orders data.
        columns:
          - name: id
            description: primary key for the orders data.
            data_tests:
              - unique
              - not_null
              
              


